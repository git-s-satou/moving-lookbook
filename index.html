<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ATELIER 01 — IN MOTION</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <span class="brand">ATELIER 01</span>
    <span class="edition">MOVING LOOKBOOK / 2026</span>
  </header>
  <main class="page">
    <section class="intro" aria-labelledby="pageTitle">
      <p class="eyebrow">EDITION 01 / AN AI FASHION STUDY</p>
      <h1 id="pageTitle">IN<br> MOTION</h1>
      <p class="lead">選ぶたび、装いが動き出す。</p>
    </section>
    <section class="stage" aria-label="着用イメージ動画">
      <div class="video-frame" id="videoFrame">
        <video id="videoA" class="layer" muted playsinline preload="auto" aria-hidden="true"></video>
        <video id="videoAToB" class="layer" muted playsinline preload="none" aria-hidden="true"></video>
        <video id="videoB" class="layer" muted playsinline preload="none" aria-hidden="true"></video>
        <video id="videoBToA" class="layer" muted playsinline preload="none" aria-hidden="true"></video>
        <div class="video-status is-shown" id="videoStatus">
          <p id="statusTitle">動画を読み込んでいます</p>
          <p id="statusText">しばらくお待ちください。</p>
          <button type="button" id="retryBtn" hidden>再試行</button>
          <button type="button" id="startBtn" hidden>再生を開始</button>
        </div>
      </div>
      <div class="video-controls">
        <span id="lookCaption">LOOK 01 / IVORY</span>
        <button type="button" id="playToggle" disabled>再生</button>
      </div>
      <div class="status-line"><p id="liveRegion" role="status" aria-live="polite">動画を読み込んでいます。</p><button type="button" id="retryInline" hidden>再試行</button></div>
    </section>
    <section class="picker" aria-labelledby="pickerHeading">
      <h2 id="pickerHeading">SELECT YOUR LOOK</h2>
      <p class="picker-help">装いを選択してください。動きの中で着替えます。</p>
      <div class="products" role="radiogroup" aria-labelledby="pickerHeading">
        <label class="product" data-item="a">
          <input type="radio" name="top" value="a" checked disabled>
          <span class="thumb"><img src="assets/a.jpg" alt=""></span>
          <span class="meta"><span class="num">01 / IVORY</span><span class="name">セーラーカラーニットベスト</span><span class="color">Ivory sailor collar</span><span class="state" data-state-for="a"></span></span>
        </label>
        <label class="product" data-item="b">
          <input type="radio" name="top" value="b" disabled>
          <span class="thumb"><img src="assets/b.jpg" alt=""></span>
          <span class="meta"><span class="num">02 / INK NAVY</span><span class="name">クルーネックニットベスト</span><span class="color">Ink navy crew neck</span><span class="state" data-state-for="b"></span></span>
        </label>
      </div>
    </section>
  </main>
  <footer class="site-footer"><span>AI-generated fashion study</span><span>AI生成による着用イメージです。</span></footer>
</body>
</html>
